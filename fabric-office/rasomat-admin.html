<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>لوحة الرسومات</title>
  <meta name="theme-color" content="#7a2e4a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .a-top { background: #2a1f24; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; }
    .a-top h1 { font-size: 18px; flex: 1; margin: 0; }
    .a-top .btn { min-height: 34px; }
    .a-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .a-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  </style>
</head>
<body>
  <div id="app"><p class="loading muted">جاري التحميل...</p></div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" aria-label="إغلاق">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/config.js"></script>
  <script src="js/rasomat-admin.js"></script>
</body>
</html>
